<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASPEC TV</title>
<style>
:root{--bg:#07070b;--panel:#111118;--text:#fff;--muted:#a3a3b2;--purple:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:16px 5%;background:rgba(7,7,11,.96);backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}
.logo{font-size:25px;font-weight:900}.logo span{color:var(--purple)}
nav{display:flex;gap:15px}nav button{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:700}
nav button:hover{color:#fff}
.search{margin-left:auto;display:flex;width:min(330px,45vw)}
.search input{width:100%;background:#101017;color:#fff;border:1px solid #ffffff15;padding:11px 13px;border-radius:10px 0 0 10px;outline:0}
.search button,.btn{border:0;background:var(--purple);color:#fff;font-weight:800;cursor:pointer}
.search button{padding:0 15px;border-radius:0 10px 10px 0}
.hero{min-height:390px;padding:65px 7%;display:flex;align-items:center;background:radial-gradient(circle at 75% 35%,#8b5cf640,transparent 35%),linear-gradient(90deg,#07070b 15%,#07070bcc 55%,#07070b33)}
.hero-content{max-width:650px}.tag{color:#c4b5fd;font-size:13px;font-weight:900;letter-spacing:2px}
h1{font-size:clamp(40px,7vw,70px);line-height:.96;margin:12px 0}.hero p{color:var(--muted);line-height:1.6}
.btn{border-radius:10px;padding:13px 20px}.section{padding:32px 5%}.section h2{margin:0 0 18px}
.notice{margin:0 5%;padding:13px 15px;background:var(--panel);border:1px solid #ffffff10;border-radius:10px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid #ffffff10;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#8b5cf666}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1c1c25}
.info{padding:11px}.title{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:12px;margin-top:5px}.empty{padding:35px 0;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:#000d}
.modal.active{display:flex}.box{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#0d0d13;border:1px solid #ffffff14;border-radius:16px}
.player{width:100%;aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0}.details{padding:20px}.details p{color:var(--muted);line-height:1.6}
.close{position:fixed;top:15px;right:17px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#000;font-size:22px;cursor:pointer}
@media(max-width:700px){header{flex-wrap:wrap;gap:13px}nav{order:3;width:100%}.search{width:100%;margin:0}.hero{padding:55px 6%}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="logo">ASPEC<span>TV</span></div>
  <nav>
    <button onclick="showAll()">Início</button>
    <button onclick="showType('movie')">Filmes</button>
    <button onclick="showType('tv')">Séries</button>
  </nav>
  <form class="search" onsubmit="searchLocal(event)">
    <input id="search" placeholder="Buscar no catálogo...">
    <button>Buscar</button>
  </form>
</header>

<main>
<section class="hero">
  <div class="hero-content">
    <div class="tag">ASPEC TV</div>
    <h1>Filmes e séries em um só lugar.</h1>
    <p>Catálogo inicial do ASPEC TV. Esta versão não usa Firebase nem chave de API.</p>
    <button class="btn" onclick="showAll()">Explorar catálogo</button>
  </div>
</section>

<div class="notice">
  Integração preparada para o EmbedMovies. Use somente conteúdo que você tenha autorização para disponibilizar.
</div>

<section class="section">
  <h2 id="heading">Catálogo</h2>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty"></div>
</section>
</main>

<div id="modal" class="modal">
  <button class="close" onclick="closePlayer()">×</button>
  <div class="box">
    <div id="player" class="player"></div>
    <div class="details">
      <h2 id="detailTitle"></h2>
      <p id="detailDescription"></p>
    </div>
  </div>
</div>

<script>
/*
  ASPEC TV
  Não é necessário TMDB API key nesta versão.

  EmbedMovies:
  - FILMES: use IMDb ID, por exemplo "tt1234567"
  - SÉRIES/ANIMES: use TMDB ID, conforme a documentação atual do serviço.

  Não coloque tokens ou chaves privadas neste arquivo público.
*/

const catalogo = [
  {
    tipo: "movie",
    titulo: "Filme de teste",
    ano: "2026",
    poster: "https://placehold.co/500x750/111118/8b5cf6?text=ASPEC+TV",
    imdbId: "COLOQUE_IMDB_ID_AQUI",
    descricao: "Título de teste do catálogo ASPEC TV."
  },
  {
    tipo: "tv",
    titulo: "Série de teste",
    ano: "2026",
    poster: "https://placehold.co/500x750/111118/8b5cf6?text=SERIE",
    tmdbId: "COLOQUE_TMDB_ID_AQUI",
    descricao: "Série de teste do catálogo ASPEC TV."
  }
];

function render(lista){
  const grid=document.getElementById("grid"), empty=document.getElementById("empty");
  grid.innerHTML=""; empty.textContent="";
  if(!lista.length){empty.textContent="Nenhum título encontrado.";return;}
  lista.forEach(item=>{
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`
      <img class="poster" src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.titulo)}">
      <div class="info">
        <div class="title">${escapeHtml(item.titulo)}</div>
        <div class="meta">${escapeHtml(item.ano)} · ${item.tipo==="tv"?"Série":"Filme"}</div>
      </div>`;
    card.onclick=()=>openPlayer(item);
    grid.appendChild(card);
  });
}

function openPlayer(item){
  document.getElementById("detailTitle").textContent=item.titulo;
  document.getElementById("detailDescription").textContent=item.descricao||"";

  let url="";
  if(item.tipo==="movie"){
    if(!item.imdbId || item.imdbId.includes("COLOQUE")){
      showPlayerMessage("ID IMDb não configurado","Edite o filme e coloque o IMDb ID.");
    }else{
      url=`https://myembed.biz/filme/${encodeURIComponent(item.imdbId)}`;
      setIframe(url);
    }
  }else{
    if(!item.tmdbId || item.tmdbId.includes("COLOQUE")){
      showPlayerMessage("ID TMDB não configurado","Edite a série e coloque o TMDB ID.");
    }else{
      url=`https://myembed.biz/serie/${encodeURIComponent(item.tmdbId)}/1/1`;
      setIframe(url);
    }
  }

  document.getElementById("modal").classList.add("active");
  document.body.style.overflow="hidden";
}

function setIframe(url){
  document.getElementById("player").innerHTML=`
    <iframe src="${url}"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen></iframe>`;
}

function showPlayerMessage(title,text){
  document.getElementById("player").innerHTML=`
    <div style="height:100%;min-height:300px;display:grid;place-items:center;color:#aaa;padding:30px;text-align:center">
      <div><h3 style="color:#fff">${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p></div>
    </div>`;
}

function closePlayer(){
  document.getElementById("modal").classList.remove("active");
  document.getElementById("player").innerHTML="";
  document.body.style.overflow="";
}

function showType(type){
  const lista=catalogo.filter(x=>x.tipo===type);
  document.getElementById("heading").textContent=type==="tv"?"Séries":"Filmes";
  render(lista);
}

function showAll(){
  document.getElementById("heading").textContent="Catálogo";
  render(catalogo);
}

function searchLocal(e){
  e.preventDefault();
  const q=document.getElementById("search").value.trim().toLowerCase();
  if(!q){showAll();return;}
  const lista=catalogo.filter(x=>x.titulo.toLowerCase().includes(q));
  document.getElementById("heading").textContent=`Busca: "${q}"`;
  render(lista);
}

function escapeHtml(value){
  return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

showAll();
</script>
</body>
</html>
