<!DOCTYPE html>
<html>
<head>
    <title>RPG 2D - A Lenda de Eldoria</title>
    <style>
        body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 3px solid #e0a800; background: #2d5a27; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // --- Jogador ---
        const player = {
            x: 400, y: 300,
            size: 30,
            speed: 3,
            hp: 100,
            maxHp: 100,
            attack: 10,
            level: 1,
            exp: 0,
            expToNext: 20
        };

        // --- Teclas ---
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.key] = true);
        document.addEventListener('keyup', (e) => keys[e.key] = false);

        // --- Inimigos ---
        let enemies = [];
        for (let i = 0; i < 5; i++) {
            enemies.push({
                x: Math.random() * 700 + 50,
                y: Math.random() * 500 + 50,
                size: 25,
                hp: 30,
                maxHp: 30,
                speed: 0.5 + Math.random() * 0.5,
                damage: 5
            });
        }

        // --- Loop do jogo ---
        function update() {
            // Movimento do jogador
            if (keys['w'] || keys['ArrowUp']) player.y -= player.speed;
            if (keys['s'] || keys['ArrowDown']) player.y += player.speed;
            if (keys['a'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['d'] || keys['ArrowRight']) player.x += player.speed;

            // Limites do mapa
            player.x = Math.max(0, Math.min(770, player.x));
            player.y = Math.max(0, Math.min(570, player.y));

            // Inimigos perseguem o jogador
            enemies.forEach(enemy => {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 0) {
                    enemy.x += (dx / dist) * enemy.speed;
                    enemy.y += (dy / dist) * enemy.speed;
                }

                // Colisão com o jogador (dano)
                if (dist < player.size/2 + enemy.size/2) {
                    // Ataca (simplificado)
                }
            });

            // Tecla Espaço para atacar (mata inimigo mais próximo)
            if (keys[' ']) {
                let closest = null;
                let closestDist = Infinity;
                enemies.forEach(enemy => {
                    const dx = player.x - enemy.x;
                    const dy = player.y - enemy.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150 && dist < closestDist) {
                        closest = enemy;
                        closestDist = dist;
                    }
                });
                if (closest) {
                    closest.hp -= player.attack;
                    if (closest.hp <= 0) {
                        enemies.splice(enemies.indexOf(closest), 1);
                        player.exp += 10;
                        // Novos inimigos spawnam
                        if (enemies.length < 8) {
                            enemies.push({
                                x: Math.random() * 700 + 50,
                                y: Math.random() * 500 + 50,
                                size: 25,
                                hp: 30 + player.level * 5,
                                maxHp: 30 + player.level * 5,
                                speed: 0.5 + Math.random() * 0.5,
                                damage: 5 + player.level
                            });
                        }
                    }
                }
                keys[' '] = false; // evita spam
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 800, 600);

            // Grid do mapa (opcional)
            for (let i = 0; i < 800; i+=40) {
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 600);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(800, i);
                ctx.stroke();
            }

            // --- Desenha inimigos ---
            enemies.forEach(enemy => {
                // Corpo
                ctx.fillStyle = '#8B0000';
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.size/2, 0, Math.PI*2);
                ctx.fill();
                // Olhos
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(enemy.x-8, enemy.y-5, 5, 0, Math.PI*2);
                ctx.arc(enemy.x+8, enemy.y-5, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(enemy.x-10, enemy.y-8, 3, 0, Math.PI*2);
                ctx.arc(enemy.x+6, enemy.y-8, 3, 0, Math.PI*2);
                ctx.fill();
                // Barra de HP
                ctx.fillStyle = '#333';
                ctx.fillRect(enemy.x-20, enemy.y-30, 40, 6);
                ctx.fillStyle = 'red';
                ctx.fillRect(enemy.x-20, enemy.y-30, 40 * (enemy.hp/enemy.maxHp), 6);
            });

            // --- Desenha jogador ---
            // Corpo (herói)
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
            // Cabeça
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(player.x, player.y - 10, 12, 0, Math.PI*2);
            ctx.fill();
            // Chapéu
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(player.x - 15, player.y - 25, 30, 6);
            ctx.fillRect(player.x - 8, player.y - 35, 16, 12);
            // Espada (indicador de direção)
            ctx.strokeStyle = '#C0C0C0';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(player.x + 20, player.y);
            ctx.lineTo(player.x + 35, player.y - 5);
            ctx.stroke();

            // --- HUD ---
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.fillText(`Nível: ${player.level}`, 10, 30);
            ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 10, 50);
            ctx.fillText(`EXP: ${player.exp}/${player.expToNext}`, 10, 70);
            ctx.fillText(`Inimigos: ${enemies.length}`, 10, 90);
            ctx.fillText('Use WASD para mover | ESPAÇO para atacar', 10, 580);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
