<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KZN MENU - Sistema de Keys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        /* (mesmo CSS que você já tem, pode manter igual) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .system-container {
            max-width: 900px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 20px;
            border: 1px solid #2d2d44;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            padding: 2rem;
            transition: all 0.3s ease;
        }
        .system-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .system-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .system-title i {
            font-size: 1.8rem;
            color: #7c3aed;
        }
        .system-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #dc2626, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .system-user {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px 8px 12px;
            border-radius: 50px;
            border: 1px solid #2d2d44;
        }
        .system-user .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc2626, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
        }
        .system-user .user-info {
            font-size: 0.85rem;
        }
        .system-user .user-info .name {
            font-weight: 600;
        }
        .system-user .user-info .role {
            font-size: 0.65rem;
            color: #94a3b8;
        }
        .btn-sair {
            background: none;
            border: 1px solid #2d2d44;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.75rem;
        }
        .btn-sair:hover {
            border-color: #dc2626;
            color: #dc2626;
        }

        .system-body {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .filter-section .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }
        .filter-section .search-box input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #2d2d44;
            background: #0f0f1a;
            color: #e2e8f0;
            outline: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .filter-section .search-box input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.1);
        }
        .filter-section .search-box button {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .filter-section .search-box button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3);
        }
        .filter-section .status-filter {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .filter-section .status-filter button {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #2d2d44;
            background: transparent;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-section .status-filter button:hover,
        .filter-section .status-filter button.active {
            border-color: #7c3aed;
            color: #e2e8f0;
            background: rgba(124, 58, 237, 0.1);
        }
        .filter-section .status-filter button.active {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
        }

        .compras-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .compras-lista::-webkit-scrollbar {
            width: 4px;
        }
        .compras-lista::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 10px;
        }

        .compra-card {
            background: #13132a;
            border: 1px solid #2d2d44;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: 0.3s;
            cursor: pointer;
        }
        .compra-card:hover {
            border-color: #7c3aed;
            background: #1a1a32;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .compra-card .info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            flex: 1;
        }
        .compra-card .info .item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #cbd5e1;
        }
        .compra-card .info .item i {
            color: #7c3aed;
            width: 16px;
            font-size: 0.7rem;
        }
        .compra-card .info .item strong {
            color: #e2e8f0;
            font-weight: 600;
        }
        .compra-card .status-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.pendente {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        .status-badge.enviado {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .status-badge.cancelado {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .status-badge.aguardando {
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
        }
        .compra-card .btn-key {
            padding: 6px 18px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .compra-card .btn-key:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        .compra-card .btn-key:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
        }
        .empty-state i {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .info-aguardando {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid #7c3aed;
            border-radius: 10px;
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* MODAL ENVIAR KEY */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-key {
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            border-radius: 20px;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
            animation: modalIn 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-key .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .modal-key .modal-header h3 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-key .modal-header h3 i {
            color: #7c3aed;
        }
        .modal-key .modal-header .close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-key .modal-header .close:hover {
            color: #dc2626;
        }
        .modal-key .comprador-info {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid #2d2d44;
        }
        .modal-key .comprador-info p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .modal-key .comprador-info p strong {
            color: #e2e8f0;
        }
        .modal-key .comprador-info .detalhes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-top: 4px;
        }
        .modal-key .comprador-info .detalhes span {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .modal-key .form-group {
            margin-bottom: 1rem;
        }
        .modal-key .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
        .modal-key .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2d2d44;
            background: #0f0f1a;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: monospace;
            outline: none;
            transition: 0.3s;
        }
        .modal-key .form-group input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.1);
        }
        .modal-key .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 0.5rem;
        }
        .modal-key .form-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-key .form-actions .btn-enviar {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
        }
        .modal-key .form-actions .btn-enviar:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 30px rgba(124, 58, 237, 0.4);
        }
        .modal-key .form-actions .btn-enviar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .modal-key .form-actions .btn-cancelar {
            background: transparent;
            border: 1px solid #2d2d44;
            color: #94a3b8;
        }
        .modal-key .form-actions .btn-cancelar:hover {
            border-color: #dc2626;
            color: #dc2626;
        }
        .modal-key .status-msg {
            margin-top: 0.8rem;
            padding: 0.6rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }
        .modal-key .status-msg.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
        }
        .modal-key .status-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            border-radius: 12px;
            padding: 12px 20px;
            color: #e2e8f0;
            font-size: 0.85rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 99999;
            display: none;
            animation: toastIn 0.4s ease;
            max-width: 350px;
        }
        .toast.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast i {
            font-size: 1.2rem;
        }
        .toast.success i {
            color: #22c55e;
        }
        .toast.error i {
            color: #ef4444;
        }
        .toast.info i {
            color: #7c3aed;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .system-container {
                padding: 1rem;
            }
            .system-title h1 {
                font-size: 1.1rem;
            }
            .system-user .user-info .name {
                font-size: 0.75rem;
            }
            .compra-card {
                flex-direction: column;
                align-items: stretch;
                padding: 0.8rem 1rem;
            }
            .compra-card .info {
                flex-direction: column;
                gap: 4px;
            }
            .compra-card .info .item {
                font-size: 0.7rem;
            }
            .compra-card .btn-key {
                width: 100%;
                justify-content: center;
                padding: 8px;
            }
            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-section .search-box {
                min-width: 100%;
            }
            .modal-key {
                padding: 1.2rem;
            }
            .modal-key .form-actions {
                flex-direction: column;
            }
            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .system-container {
                padding: 0.8rem;
                border-radius: 12px;
            }
            .system-title i {
                font-size: 1.2rem;
            }
            .system-title h1 {
                font-size: 0.95rem;
            }
            .system-user {
                padding: 4px 10px 4px 8px;
            }
            .system-user .avatar {
                width: 26px;
                height: 26px;
                font-size: 0.65rem;
            }
            .compra-card .info .item {
                font-size: 0.65rem;
            }
            .status-badge {
                font-size: 0.55rem;
                padding: 2px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">Mensagem</span>
    </div>

    <!-- ===== SISTEMA ===== -->
    <div class="system-container" id="systemContainer">
        <div class="system-header">
            <div class="system-title">
                <i class="fas fa-key"></i>
                <h1>Gerenciamento de Keys</h1>
            </div>
            <div class="system-user">
                <div class="avatar" id="adminAvatar">P</div>
                <div class="user-info">
                    <div class="name" id="adminName">Proprietário</div>
                    <div class="role"><i class="fas fa-crown"></i> Proprietário</div>
                </div>
                <button class="btn-sair" onclick="sairSistema()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="system-body">
            <!-- Filtros -->
            <div class="filter-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar comprador, e-mail ou produto..." oninput="filtrarCompras()">
                    <button onclick="filtrarCompras()"><i class="fas fa-search"></i></button>
                </div>
                <div class="status-filter" id="statusFilter">
                    <button class="active" data-status="todos" onclick="setFiltroStatus('todos')">Todos</button>
                    <button data-status="aguardando" onclick="setFiltroStatus('aguardando')">Aguardando</button>
                    <button data-status="enviado" onclick="setFiltroStatus('enviado')">Enviado</button>
                    <button data-status="cancelado" onclick="setFiltroStatus('cancelado')">Cancelado</button>
                </div>
            </div>

            <!-- Info: quantidade de compras aguardando -->
            <div class="info-aguardando" id="infoAguardando">
                <i class="fas fa-clock"></i> <span id="contAguardando">0</span> compra(s) aguardando Key.
            </div>

            <!-- Lista de Compras -->
            <div class="compras-lista" id="comprasList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>Carregando compras...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ENVIAR KEY ===== -->
    <div class="modal-overlay" id="modalKey">
        <div class="modal-key">
            <div class="modal-header">
                <h3><i class="fas fa-paper-plane"></i> Enviar Key</h3>
                <button class="close" onclick="fecharModalKey()">&times;</button>
            </div>
            <div class="comprador-info">
                <p><strong id="modalCompradorNome">Carregando...</strong></p>
                <div class="detalhes">
                    <span><i class="fas fa-envelope"></i> <span id="modalCompradorEmail">email@exemplo.com</span></span>
                    <span><i class="fas fa-tag"></i> <span id="modalCompradorProduto">Produto</span></span>
                    <span><i class="fas fa-calendar"></i> <span id="modalCompradorData">00/00/0000</span></span>
                </div>
            </div>
            <div class="form-group">
                <label for="keyInput"><i class="fas fa-key"></i> Chave da Key</label>
                <input type="text" id="keyInput" placeholder="Cole a Key aqui..." autocomplete="off">
            </div>
            <div class="form-actions">
                <button class="btn-cancelar" onclick="fecharModalKey()">Cancelar</button>
                <button class="btn-enviar" id="btnEnviarKey" onclick="enviarKey()">
                    <i class="fas fa-paper-plane"></i> Enviar Key
                </button>
            </div>
            <div class="status-msg" id="modalStatus"></div>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyA-3mN_h8XQMis4vqfoPm2RkwOKJ-p7k2Q",
            authDomain: "chat-kzn.firebaseapp.com",
            databaseURL: "https://chat-kzn-default-rtdb.firebaseio.com",
            projectId: "chat-kzn",
            storageBucket: "chat-kzn.firebasestorage.app",
            messagingSenderId: "641963268535",
            appId: "1:641963268535:web:b1f8b26f69840f527a7032",
            measurementId: "G-JZHCPK3VRP"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // ===== CONSTANTES =====
        const PROPRIETARIO_EMAIL = 'gabriel6061yt@gmail.com';
        const STORAGE_KEY = 'kzn_sistema_key';

        // ===== ESTADO =====
        let usuarioAtual = null;
        let compras = [];
        let compraSelecionada = null;
        let filtroStatus = 'todos';
        let termoBusca = '';

        // ===== TOAST =====
        function showToast(msg, tipo = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const icon = toast.querySelector('i');

            toast.className = 'toast';
            toastMsg.textContent = msg;

            if (tipo === 'success') {
                toast.classList.add('success');
                icon.className = 'fas fa-check-circle';
            } else if (tipo === 'error') {
                toast.classList.add('error');
                icon.className = 'fas fa-times-circle';
            } else {
                toast.classList.add('info');
                icon.className = 'fas fa-info-circle';
            }

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ===== VERIFICAR AUTENTICAÇÃO =====
        function verificarAutenticacao() {
            return new Promise((resolve) => {
                const usuarioSalvo = localStorage.getItem(STORAGE_KEY);
                if (usuarioSalvo) {
                    try {
                        const dados = JSON.parse(usuarioSalvo);
                        if (dados.email === PROPRIETARIO_EMAIL) {
                            usuarioAtual = dados;
                            document.getElementById('adminName').textContent = dados.nome || 'Proprietário';
                            const avatar = document.getElementById('adminAvatar');
                            avatar.textContent = (dados.nome || 'P')[0].toUpperCase();
                            resolve(true);
                            return;
                        }
                    } catch (e) {}
                }

                const siteUser = localStorage.getItem('kzn_usuario_logado');
                if (siteUser) {
                    try {
                        const dados = JSON.parse(siteUser);
                        if (dados.email === PROPRIETARIO_EMAIL) {
                            usuarioAtual = dados;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
                            document.getElementById('adminName').textContent = dados.nome || 'Proprietário';
                            const avatar = document.getElementById('adminAvatar');
                            avatar.textContent = (dados.nome || 'P')[0].toUpperCase();
                            resolve(true);
                            return;
                        }
                    } catch (e) {}
                }

                auth.onAuthStateChanged((user) => {
                    if (user && user.email === PROPRIETARIO_EMAIL) {
                        usuarioAtual = {
                            email: user.email,
                            nome: user.displayName || 'Proprietário',
                            uid: user.uid
                        };
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(usuarioAtual));
                        document.getElementById('adminName').textContent = usuarioAtual.nome;
                        const avatar = document.getElementById('adminAvatar');
                        avatar.textContent = (usuarioAtual.nome || 'P')[0].toUpperCase();
                        resolve(true);
                    } else {
                        if (!user) {
                            window.location.href = '/';
                        } else {
                            showToast('Acesso negado. Apenas o proprietário pode acessar.', 'error');
                            setTimeout(() => { window.location.href = '/'; }, 2000);
                            resolve(false);
                        }
                    }
                });
            });
        }

        // ===== SAIR =====
        function sairSistema() {
            if (confirm('Deseja sair do sistema?')) {
                localStorage.removeItem(STORAGE_KEY);
                auth.signOut().catch(() => {});
                window.location.href = '/';
            }
        }

        // ===== CARREGAR COMPRAS =====
        function carregarCompras() {
            const comprasRef = db.ref('compras');
            comprasRef.on('value', (snapshot) => {
                const dados = snapshot.val() || {};
                compras = [];
                Object.keys(dados).forEach(key => {
                    const compra = dados[key];
                    compra.id = key;
                    if (compra.userId) {
                        const userRef = db.ref('usuarios/' + compra.userId);
                        userRef.once('value', (userSnap) => {
                            const userData = userSnap.val() || {};
                            compra.usuario = userData;
                            compra.usuarioId = compra.userId;
                            renderizarCompras();
                        });
                    } else {
                        compra.usuario = { nome: 'Desconhecido', email: compra.email || 'sem@email' };
                        compras.push(compra);
                    }
                });
                setTimeout(() => {
                    renderizarCompras();
                }, 500);
            });
        }

        // ===== RENDERIZAR COMPRAS =====
        function renderizarCompras() {
            const container = document.getElementById('comprasList');
            const filtrados = compras.filter(compra => {
                if (filtroStatus !== 'todos' && compra.status !== filtroStatus) return false;
                if (termoBusca) {
                    const busca = termoBusca.toLowerCase();
                    const nome = (compra.usuario?.nome || '').toLowerCase();
                    const email = (compra.usuario?.email || compra.email || '').toLowerCase();
                    const produto = (compra.produto || '').toLowerCase();
                    if (!nome.includes(busca) && !email.includes(busca) && !produto.includes(busca)) return false;
                }
                return true;
            });

            // Atualizar contador de aguardando
            const aguardando = compras.filter(c => c.status === 'aguardando' && (!c.key || c.key.trim() === ''));
            document.getElementById('contAguardando').textContent = aguardando.length;

            if (filtrados.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>Nenhuma compra encontrada</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtrados.map(compra => {
                const statusClass = compra.status || 'aguardando';
                const statusLabel = statusClass === 'aguardando' ? 'Aguardando Key' :
                    statusClass === 'enviado' ? 'Key Enviada' :
                    statusClass === 'cancelado' ? 'Cancelado' : statusClass;

                const nomeUsuario = compra.usuario?.nome || compra.nome || 'Usuário';
                const emailUsuario = compra.usuario?.email || compra.email || 'sem@email';
                const dataCompra = compra.data ? new Date(compra.data).toLocaleDateString('pt-BR') : '--/--/----';
                const horaCompra = compra.hora || '--:--';

                const keyEnviada = compra.key && compra.key.trim() !== '';
                const podeEnviar = !keyEnviada && compra.status !== 'cancelado' && compra.status !== 'enviado';

                return `
                    <div class="compra-card" onclick="selecionarCompra('${compra.id}')">
                        <div class="info">
                            <span class="item"><i class="fas fa-user"></i> <strong>${nomeUsuario}</strong></span>
                            <span class="item"><i class="fas fa-envelope"></i> ${emailUsuario}</span>
                            <span class="item"><i class="fas fa-tag"></i> ${compra.produto || 'Produto'}</span>
                            <span class="item"><i class="fas fa-calendar"></i> ${dataCompra} ${horaCompra}</span>
                            <span class="item"><i class="fas ${keyEnviada ? 'fa-check-circle' : 'fa-clock'}"></i> ${keyEnviada ? 'Key enviada' : 'Aguardando key'}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                            ${podeEnviar ? `<button class="btn-key" onclick="event.stopPropagation(); abrirModalKey('${compra.id}')"><i class="fas fa-paper-plane"></i> Enviar Key</button>` : ''}
                            ${keyEnviada ? `<span style="font-size:0.65rem;color:#22c55e;"><i class="fas fa-check"></i> Enviada em ${compra.dataEnvio ? new Date(compra.dataEnvio).toLocaleString('pt-BR') : ''}</span>` : ''}
                            ${compra.status === 'cancelado' ? `<span style="font-size:0.65rem;color:#ef4444;"><i class="fas fa-ban"></i> Cancelada</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== FILTROS =====
        function setFiltroStatus(status) {
            filtroStatus = status;
            document.querySelectorAll('#statusFilter button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.status === status);
            });
            renderizarCompras();
        }

        function filtrarCompras() {
            termoBusca = document.getElementById('searchInput').value.trim();
            renderizarCompras();
        }

        // ===== MODAL ENVIAR KEY =====
        function abrirModalKey(compraId) {
            const compra = compras.find(c => c.id === compraId);
            if (!compra) {
                showToast('Compra não encontrada.', 'error');
                return;
            }

            if (compra.status === 'cancelado' || compra.status === 'enviado') {
                showToast('Esta compra não pode receber Key.', 'error');
                return;
            }

            if (compra.key && compra.key.trim() !== '') {
                showToast('Esta compra já possui uma Key enviada.', 'error');
                return;
            }

            compraSelecionada = compra;
            document.getElementById('modalCompradorNome').textContent = compra.usuario?.nome || compra.nome || 'Usuário';
            document.getElementById('modalCompradorEmail').textContent = compra.usuario?.email || compra.email || 'sem@email';
            document.getElementById('modalCompradorProduto').textContent = compra.produto || 'Produto';
            document.getElementById('modalCompradorData').textContent = compra.data ? new Date(compra.data).toLocaleDateString(
                'pt-BR') : '--/--/----';
            document.getElementById('keyInput').value = '';
            document.getElementById('modalStatus').className = 'status-msg';
            document.getElementById('modalStatus').textContent = '';
            document.getElementById('btnEnviarKey').disabled = false;
            document.getElementById('modalKey').classList.add('open');
            document.getElementById('keyInput').focus();
        }

        function fecharModalKey() {
            document.getElementById('modalKey').classList.remove('open');
            compraSelecionada = null;
        }

        // ===== ENVIAR KEY =====
        function enviarKey() {
            const key = document.getElementById('keyInput').value.trim();
            const statusMsg = document.getElementById('modalStatus');

            if (!key) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = '⚠️ Digite a Key antes de enviar.';
                return;
            }

            if (!compraSelecionada) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = '❌ Nenhuma compra selecionada.';
                return;
            }

            if (compraSelecionada.status === 'cancelado' || compraSelecionada.status === 'enviado') {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = '❌ Esta compra não pode receber Key.';
                return;
            }

            if (compraSelecionada.key && compraSelecionada.key.trim() !== '') {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = '❌ Esta compra já possui uma Key.';
                return;
            }

            document.getElementById('btnEnviarKey').disabled = true;
            statusMsg.className = 'status-msg';
            statusMsg.textContent = 'Enviando...';

            const agora = new Date();
            const dataEnvio = agora.toISOString();
            const horaEnvio = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const compraRef = db.ref('compras/' + compraSelecionada.id);
            const updates = {
                key: key,
                dataEnvio: dataEnvio,
                horaEnvio: horaEnvio,
                status: 'enviado'
            };

            compraRef.update(updates)
                .then(() => {
                    statusMsg.className = 'status-msg success';
                    statusMsg.textContent = '✅ Key enviada com sucesso!';
                    document.getElementById('btnEnviarKey').disabled = false;

                    const userId = compraSelecionada.usuarioId || compraSelecionada.userId;
                    if (userId) {
                        const notifRef = db.ref('notificacoes').push();
                        notifRef.set({
                            userId: userId,
                            tipo: 'key_enviada',
                            titulo: 'Nova Key disponível!',
                            mensagem: `Sua Key para "${compraSelecionada.produto || 'seu produto'}" foi enviada. Acesse sua área de compras para visualizar.`,
                            data: new Date().toISOString(),
                            lida: false,
                            compraId: compraSelecionada.id
                        });
                    }

                    showToast('Key enviada com sucesso!', 'success');

                    setTimeout(() => {
                        fecharModalKey();
                        renderizarCompras();
                    }, 1200);
                })
                .catch((error) => {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = '❌ Erro ao enviar Key: ' + error.message;
                    document.getElementById('btnEnviarKey').disabled = false;
                    showToast('Erro ao enviar Key.', 'error');
                });
        }

        // ===== SELECIONAR COMPRA =====
        function selecionarCompra(compraId) {
            const compra = compras.find(c => c.id === compraId);
            if (!compra) return;

            if (compra.key && compra.key.trim() !== '') {
                showToast(`🔑 Key: ${compra.key}`, 'info');
            } else if (compra.status === 'aguardando') {
                abrirModalKey(compraId);
            } else {
                showToast(`Status: ${compra.status || 'aguardando'}`, 'info');
            }
        }

        // ===== CARREGAR DADOS INICIAIS =====
        async function init() {
            const autenticado = await verificarAutenticacao();
            if (!autenticado) return;
            carregarCompras();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
